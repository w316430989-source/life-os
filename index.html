<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><meta name="theme-color" content="#1d2025"><link rel="manifest" href="manifest.json"><title>Life OS</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<header class="header"><div><p class="eyebrow">LIFE OS / V0.9</p><h1>万事归位，各行其道</h1><p id="date"></p></div><div class="score"><strong id="rate">0%</strong><span>今日完成率</span></div></header>
<nav class="program-nav" id="programNav"></nav>
<section class="program-map card"><div class="card-title"><h2>九大程序</h2><span>系统职责地图</span></div><div id="programMap" class="program-map-grid"></div></section>
<section class="principles card"><div class="card-title"><h2>十大定论</h2><span>Life OS 核心规则</span></div><div id="principleGrid" class="principle-grid"></div></section>
<section class="stats"><div class="stat"><span>已完成</span><strong id="completedCount">0/18</strong></div><div class="stat"><span>连续满完成</span><strong id="streak">0</strong><small>天</small></div><div class="stat wide"><span>今日进度</span><div class="progress"><i id="progressBar"></i></div></div></section>
<section class="program-intro card"><div><p class="eyebrow">CURRENT PROGRAM</p><h2 id="programTitle">生活程序</h2><p id="programDescription"></p><p class="program-duty"><b>职责：</b><span id="programDuty"></span></p></div><div class="program-count"><strong id="programCompleted">0</strong><span>本程序完成</span></div></section>
<section class="dashboard"><div class="card dashboard-card"><div class="card-title"><h2>执行趋势</h2><span>最近 7 / 30 天</span></div><div class="range-buttons"><button class="range active" data-days="7">7 天</button><button class="range" data-days="30">30 天</button></div><div id="trendChart" class="trend-chart"></div></div><div class="card dashboard-card"><div class="card-title"><h2>核心指标</h2><span id="summaryRange">最近 7 天</span></div><div class="metric-grid"><div><span>平均完成率</span><strong id="avgRate">—</strong></div><div><span>平均阅读</span><strong id="avgReading">—</strong></div><div><span>平均手机</span><strong id="avgPhone">—</strong></div><div><span>平均睡眠</span><strong id="avgSleep">—</strong></div></div></div></section>
<section class="grid"><div class="card tasks-card"><div class="card-title"><h2 id="taskTitle">今日任务</h2><span>程序任务</span></div><div id="fixedTasks" class="tasks"></div><div class="card-title extra"><h2>额外任务</h2><span>最多 8 项</span></div><div id="extraTasks" class="tasks"></div><button id="addTask" class="secondary">＋ 添加额外任务</button></div><div class="side"><div class="card"><div class="card-title"><h2>今日状态</h2><span>小时</span></div><label>思维时间 <input id="thinking" type="number" min="0" step="0.5" placeholder="0"></label><label>放纵时间 <input id="indulgence" type="number" min="0" step="0.5" placeholder="0"></label><label>阅读时间 <input id="reading" type="number" min="0" step="0.5" placeholder="0"></label><label>手机时间 <input id="phone" type="number" min="0" step="0.5" placeholder="0"></label><label>睡眠时间 <input id="sleep" type="number" min="0" step="0.5" placeholder="0"></label></div><div class="card principle"><p class="eyebrow">TODAY'S RULE</p><h2 id="ruleTitle">洗衣论</h2><p id="ruleText"></p></div><div class="card"><div class="card-title"><h2>历史执行</h2><span>最近 7 天</span></div><div id="historyList" class="history-list"></div></div><button id="resetToday" class="reset">重置今天</button></div></section>
</main><script src="app.js"></script></body></html>
